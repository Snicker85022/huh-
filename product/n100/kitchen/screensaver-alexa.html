<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taza — Loading Dock Rest</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #c7a84b;
    font-family: 'Inter', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, rgba(61,90,128,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 50% 100%, rgba(199,168,75,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
    z-index: 10;
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 900px;
    padding: 20px;
  }

  .vans-row {
    display: flex;
    gap: clamp(40px, 8vw, 120px);
    align-items: flex-end;
    justify-content: center;
  }

  .van-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .van-label {
    font-family: 'Inter', sans-serif;
    font-size: clamp(10px, 1.4vw, 14px);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(91,138,181,0.9);
  }

  .van-svg {
    filter: drop-shadow(0 0 8px rgba(199,168,75,0.28));
    animation: vanGlow 4s ease-in-out infinite;
  }
  .van-svg.van2 { animation-delay: -2s; }

  @keyframes vanGlow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(199,168,75,0.22)); }
    50%       { filter: drop-shadow(0 0 18px rgba(199,168,75,0.45)); }
  }

  .diamond-wrap {
    animation: breathe 4.5s ease-in-out infinite;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .diamond-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(199,168,75,0.35));
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.85; }
    50%       { transform: scale(1.06); opacity: 1; }
  }

  .tagline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 3vw, 32px);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #c7a84b;
    text-align: center;
  }

  .event-name {
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 2vw, 20px);
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(199,168,75,0.6);
    text-align: center;
  }

  .rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(199,168,75,0.45), transparent);
  }

  .clock {
    position: fixed;
    bottom: 28px;
    right: 36px;
    font-size: clamp(13px, 1.8vw, 18px);
    font-weight: 300;
    color: rgba(199,168,75,0.6);
    letter-spacing: 0.08em;
    z-index: 15;
  }

  .tap-hint {
    position: fixed;
    bottom: 28px;
    left: 36px;
    font-size: 11px;
    font-weight: 300;
    color: rgba(199,168,75,0.25);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    z-index: 15;
  }

  .road-lines {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }

  .road-line {
    position: absolute;
    bottom: 0;
    height: 100%;
    width: 40px;
    background: linear-gradient(to top, rgba(91,138,181,0.22), transparent);
    animation: roadMove 3s linear infinite;
  }

  @keyframes roadMove {
    from { transform: translateY(0); }
    to   { transform: translateY(60px); }
  }
</style>
</head>
<body onclick="window.location.href='http://192.168.2.102:9003/van-loadout.html'">

  <div class="content">
    <div class="vans-row">

      <div class="van-unit">
        <svg class="van-svg" width="260" height="140" viewBox="0 0 260 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="42" width="232" height="82" rx="8" stroke="#c7a84b" stroke-width="1.8" opacity="0.8"/>
          <rect x="20" y="12" width="180" height="34" rx="6" stroke="#c7a84b" stroke-width="1.5" opacity="0.65"/>

          <path d="M200 46 L220 46 L220 68 L200 68" stroke="#c7a84b" stroke-width="1.3" opacity="0.6"/>
          <rect x="70" y="50" width="90" height="66" rx="3" stroke="#c7a84b" stroke-width="1.2" opacity="0.5"/>
          <rect x="210" y="50" width="26" height="68" rx="4" stroke="#c7a84b" stroke-width="1.3" opacity="0.6"/>
          <rect x="12" y="50" width="44" height="68" rx="3" stroke="#c7a84b" stroke-width="1.2" opacity="0.5"/>
          <line x1="34" y1="50" x2="34" y2="118" stroke="#c7a84b" stroke-width="0.8" opacity="0.35"/>
          <circle cx="56" cy="124" r="13" stroke="#c7a84b" stroke-width="1.8" opacity="0.75"/>
          <circle cx="56" cy="124" r="5"  stroke="#c7a84b" stroke-width="1" opacity="0.45"/>
          <circle cx="196" cy="124" r="13" stroke="#c7a84b" stroke-width="1.8" opacity="0.75"/>
          <circle cx="196" cy="124" r="5"  stroke="#c7a84b" stroke-width="1" opacity="0.45"/>
          <rect x="234" y="60" width="10" height="8" rx="2" stroke="#c7a84b" stroke-width="1" opacity="0.65"/>
          <rect x="8" y="62" width="6" height="10" rx="1" stroke="#c7a84b" stroke-width="1" opacity="0.65"/>
          <ellipse cx="130" cy="138" rx="110" ry="4" fill="#c7a84b" opacity="0.08"/>
        </svg>
        <div class="van-label">Van 1 — ProMaster HR</div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:28px;">
        <div class="diamond-wrap">
          <img src="faviqr.png" alt="Taza">
        </div>
      </div>

      <div class="van-unit">
        <svg class="van-svg van2" width="190" height="110" viewBox="0 0 190 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="28" width="168" height="68" rx="7" stroke="#c7a84b" stroke-width="1.8" opacity="0.7"/>
          <rect x="18" y="12" width="120" height="20" rx="5" stroke="#c7a84b" stroke-width="1.3" opacity="0.55"/>
          <line x1="18" y1="32" x2="18" y2="12" stroke="#c7a84b" stroke-width="1" opacity="0.45"/>

          <rect x="48" y="34" width="72" height="56" rx="3" stroke="#c7a84b" stroke-width="1.1" opacity="0.45"/>
          <rect x="150" y="36" width="20" height="54" rx="4" stroke="#c7a84b" stroke-width="1.2" opacity="0.55"/>
          <rect x="10" y="36" width="30" height="54" rx="3" stroke="#c7a84b" stroke-width="1.1" opacity="0.45"/>
          <line x1="25" y1="36" x2="25" y2="90" stroke="#c7a84b" stroke-width="0.8" opacity="0.3"/>
          <circle cx="44" cy="96" r="11" stroke="#c7a84b" stroke-width="1.6" opacity="0.7"/>
          <circle cx="44" cy="96" r="4"  stroke="#c7a84b" stroke-width="0.9" opacity="0.4"/>
          <circle cx="144" cy="96" r="11" stroke="#c7a84b" stroke-width="1.6" opacity="0.7"/>
          <circle cx="144" cy="96" r="4"  stroke="#c7a84b" stroke-width="0.9" opacity="0.4"/>
          <rect x="168" y="46" width="8" height="7" rx="2" stroke="#c7a84b" stroke-width="1" opacity="0.6"/>
          <ellipse cx="95" cy="108" rx="80" ry="3" fill="#c7a84b" opacity="0.07"/>
        </svg>
        <div class="van-label">Van 2 — ProMaster City</div>
      </div>

    </div>

    <div class="rule"></div>

    <div class="tagline">Ready to Roll</div>
    <div class="event-name" id="event-line">Taza Catering &amp; Events</div>
  </div>

  <div class="road-lines" id="road-lines"></div>

  <div class="clock" id="clock"></div>
  <div class="tap-hint">Tap to wake</div>

<script>
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m + ':' + s;
  }
  tick();
  setInterval(tick, 1000);

  const road = document.getElementById('road-lines');
  for (let i = 0; i < 7; i++) {
    const l = document.createElement('div');
    l.className = 'road-line';
    l.style.left = (i * 14) + 3 + '%';
    l.style.animationDelay = -(i * 0.43) + 's';
    road.appendChild(l);
  }

  fetch('http://192.168.2.102:9003/situational.json')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (d && d.today && d.today.event) {
        document.getElementById('event-line').textContent = d.today.event;
      }
    })
    .catch(() => {});
</script>
</body>
</html>
