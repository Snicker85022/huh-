<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taza — Kitchen Soul</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #c7a84b;
    font-family: 'Inter', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    position: relative;
  }

  .bg-texture {
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(ellipse 60% 40% at 30% 40%, rgba(199,168,75,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 70% 60%, rgba(61,90,128,0.18) 0%, transparent 70%),
      linear-gradient(135deg, #141414 0%, #232323 40%, #1a1a1a 70%, #101010 100%);
    animation: panBg 60s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes panBg {
    0%   { transform: translate(0, 0) scale(1.08); }
    33%  { transform: translate(-3%, 2%) scale(1.12); }
    66%  { transform: translate(2%, -2%) scale(1.1); }
    100% { transform: translate(-1%, 3%) scale(1.08); }
  }

  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    z-index: 2;
  }

  .diamond-wrap {
    width: 200px;
    height: 200px;
    animation: breatheGlow 5s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(199,168,75,0.45));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .diamond-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  @keyframes breatheGlow {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 14px rgba(199,168,75,0.28)); }
    50%       { transform: scale(1.05); filter: drop-shadow(0 0 32px rgba(199,168,75,0.6)); }
  }

  .quote-container {
    position: relative;
    height: 3.2em;
    width: min(90vw, 700px);
    text-align: center;
  }

  .quote {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(16px, 2.6vw, 30px);
    font-weight: 400;
    color: rgba(199,168,75,0.9);
    letter-spacing: 0.03em;
    opacity: 0;
    line-height: 1.35;
    animation: crossfade 30s linear infinite;
    padding: 0 16px;
  }

  .quote:nth-child(1) { animation-delay:  0s; }
  .quote:nth-child(2) { animation-delay:  6s; }
  .quote:nth-child(3) { animation-delay: 12s; }
  .quote:nth-child(4) { animation-delay: 18s; }
  .quote:nth-child(5) { animation-delay: 24s; }

  @keyframes crossfade {
    0%    { opacity: 0; }
    4%    { opacity: 1; }
    16%   { opacity: 1; }
    20%   { opacity: 0; }
    100%  { opacity: 0; }
  }

  .rule {
    width: 140px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(199,168,75,0.45), transparent);
  }

  .pool-warm {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,150,12,0.07) 0%, transparent 70%);
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .pool-warm:nth-child(1) { top: -100px; left: -50px; animation-delay: 0s; }
  .pool-warm:nth-child(2) { bottom: -80px; right: -60px; animation-delay: -9s; }

  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(30px, 20px); }
  }

  .clock {
    position: fixed;
    bottom: 28px;
    right: 36px;
    font-family: 'Inter', sans-serif;
    font-size: clamp(14px, 1.8vw, 20px);
    font-weight: 300;
    color: rgba(199,168,75,0.6);
    letter-spacing: 0.08em;
    z-index: 3;
  }

  .tap-hint {
    position: fixed;
    bottom: 28px;
    left: 36px;
    font-size: 11px;
    font-weight: 300;
    color: rgba(199,168,75,0.25);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    z-index: 3;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body onclick="window.location.href='http://192.168.2.102:9003/tcl2-west.html'">

  <div class="bg-texture"></div>
  <div class="pool-warm"></div>
  <div class="pool-warm"></div>

  <div class="center">
    <div class="diamond-wrap">
      <img src="faviqr.png" alt="Taza">
    </div>

    <div class="rule"></div>

    <div class="quote-container">
      <div class="quote">Mise en place is a way of life.</div>
      <div class="quote">The walk-in holds the story of the day.</div>
      <div class="quote">Hot food hot. Cold food cold. Always.</div>
      <div class="quote">Sandra's kitchen runs on precision and heart.</div>
      <div class="quote">We cook with intention. Every plate tells a story.</div>
    </div>
  </div>

  <div class="clock" id="clock"></div>
  <div class="tap-hint">Tap to wake</div>

<script>
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m + ':' + s;
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
