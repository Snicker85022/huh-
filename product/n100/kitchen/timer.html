<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Taza Kitchen Timer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a3a2a;
  --bg-card: #1f4433;
  --gold: #c7ae59;
  --gold-dim: #a08a3a;
  --blue: #426a9f;
  --text: #f0f3f7;
  --text-dim: #8fa8a0;
  --alarm-red: #c0392b;
  --alarm-gold: #f1c40f;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 18px 20px 10px;
}
.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--gold);
}

/* ── Mic indicator ── */
.mic-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
  transition: background 0.3s;
}
.mic-dot.active {
  background: #2ecc71;
  animation: micPulse 1.8s ease-in-out infinite;
}
.mic-dot.wake {
  background: var(--gold);
  animation: micPulse 0.5s ease-in-out infinite;
}
@keyframes micPulse {
  0%, 100% { box-shadow: 0 0 4px transparent; }
  50% { box-shadow: 0 0 14px currentColor, 0 0 28px currentColor; }
}
.mic-dot.active { color: #2ecc71; }
.mic-dot.wake { color: var(--gold); }

/* ── Activation overlay ── */
.activate-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 30, 20, 0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  gap: 30px;
}
.activate-overlay.hidden { display: none; }
.activate-btn {
  background: var(--gold);
  color: #1a2a1a;
  border: none;
  border-radius: 20px;
  padding: 30px 60px;
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  animation: btnPulse 2s ease-in-out infinite;
}
@keyframes btnPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(199, 174, 89, 0.3); }
  50% { transform: scale(1.04); box-shadow: 0 0 40px rgba(199, 174, 89, 0.5); }
}
.activate-sub {
  color: var(--text-dim);
  font-size: 1.1rem;
}

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: calc(100vh - 140px);
  gap: 24px;
  text-align: center;
  padding: 20px;
}
.empty-state.hidden { display: none; }
.empty-mic-icon {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(46, 204, 113, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: emptyPulse 2.5s ease-in-out infinite;
}
@keyframes emptyPulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.1); opacity: 1; }
}
.empty-mic-icon svg { width: 40px; height: 40px; fill: #2ecc71; }
.empty-state p {
  font-size: 1.4rem;
  color: var(--text-dim);
  max-width: 400px;
  line-height: 1.6;
}
.empty-state .hint {
  font-size: 1rem;
  color: var(--text-dim);
  opacity: 0.6;
}

/* ── Timer grid ── */
.timer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  padding: 20px;
  max-width: 1000px;
  margin: 0 auto;
}
.timer-grid.hidden { display: none; }

/* ── Timer card ── */
.timer-card {
  background: var(--bg-card);
  border: 2px solid rgba(199, 174, 89, 0.2);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: border-color 0.3s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.timer-card:active { transform: scale(0.97); }

.timer-card.alarm {
  animation: alarmFlash 0.8s ease-in-out infinite alternate;
}
@keyframes alarmFlash {
  0% { background: var(--alarm-red); border-color: var(--alarm-gold); }
  100% { background: #8b1a1a; border-color: var(--alarm-red); }
}

/* ── SVG ring ── */
.ring-container {
  position: relative;
  width: 160px; height: 160px;
}
.ring-container svg {
  transform: rotate(-90deg);
  width: 160px; height: 160px;
}
.ring-bg {
  fill: none;
  stroke: rgba(199, 174, 89, 0.15);
  stroke-width: 8;
}
.ring-progress {
  fill: none;
  stroke: var(--gold);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s linear;
}
.ring-time {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.timer-label {
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--gold);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.timer-status {
  font-size: 0.95rem;
  color: var(--text-dim);
}
.timer-card.alarm .timer-status {
  color: var(--alarm-gold);
  font-weight: 700;
  font-size: 1.1rem;
}

/* ── Add button ── */
.add-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--blue);
  border: none;
  color: white;
  font-size: 2.4rem;
  font-weight: 300;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}
.add-btn:active { transform: scale(0.9); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--bg-card);
  border: 2px solid var(--gold-dim);
  border-radius: 20px;
  padding: 30px;
  width: 90%;
  max-width: 380px;
}
.modal h2 {
  color: var(--gold);
  font-size: 1.3rem;
  margin-bottom: 20px;
  text-align: center;
  letter-spacing: 1px;
}
.modal-input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid var(--blue);
  background: var(--bg);
  color: var(--text);
  font-size: 1.2rem;
  margin-bottom: 16px;
  outline: none;
}
.modal-input:focus { border-color: var(--gold); }
.modal-input::placeholder { color: var(--text-dim); }

.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.numpad button {
  padding: 16px;
  border-radius: 10px;
  border: 1px solid rgba(199,174,89,0.3);
  background: var(--bg);
  color: var(--text);
  font-size: 1.5rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.numpad button:active { background: var(--blue); }
.numpad .backspace { font-size: 1.2rem; }

.modal-actions {
  display: flex;
  gap: 12px;
}
.modal-actions button {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-cancel {
  background: rgba(255,255,255,0.1);
  color: var(--text-dim);
}
.btn-start {
  background: var(--gold);
  color: #1a2a1a;
}

/* ── Voice feedback bar ── */
.voice-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(26, 58, 42, 0.95);
  border-top: 1px solid rgba(199,174,89,0.3);
  padding: 12px 20px;
  text-align: center;
  font-size: 1.1rem;
  color: var(--gold);
  transform: translateY(100%);
  transition: transform 0.3s;
  z-index: 200;
}
.voice-bar.visible { transform: translateY(0); }
.voice-bar .transcript { color: var(--text); font-style: italic; }
</style>
</head>
<body>

<!-- Activation overlay -->
<div class="activate-overlay" id="activateOverlay">
  <button class="activate-btn" id="activateBtn">TAP TO ACTIVATE VOICE</button>
  <p class="activate-sub">Microphone access required for voice commands</p>
</div>

<!-- Header -->
<div class="header">
  <div class="mic-dot" id="micDot"></div>
  <h1>TAZA KITCHEN TIMER</h1>
</div>

<!-- Empty state -->
<div class="empty-state" id="emptyState">
  <div class="empty-mic-icon">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </div>
  <p>Say <strong>"Hey Micro"</strong> to set a timer</p>
  <p class="hint">Example: "Hey Micro... salmon 12 minutes"</p>
</div>

<!-- Timer grid -->
<div class="timer-grid hidden" id="timerGrid"></div>

<!-- Add button -->
<button class="add-btn" id="addBtn">+</button>

<!-- Manual add modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2>ADD TIMER</h2>
    <input class="modal-input" id="labelInput" type="text" placeholder="Label (e.g. Salmon)" autocomplete="off">
    <input class="modal-input" id="durationInput" type="text" placeholder="Minutes" readonly>
    <div class="numpad" id="numpad">
      <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button>
      <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button>
      <button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button>
      <button class="backspace" data-val="back">&larr;</button><button data-val="0">0</button><button data-val="." >.</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-start" id="modalStart">Start</button>
    </div>
  </div>
</div>

<!-- Voice feedback bar -->
<div class="voice-bar" id="voiceBar">
  <span class="transcript" id="voiceText"></span>
</div>

<script>
// ── State ──
const timers = [];
let nextId = 1;
let recognition = null;
let isListening = false;
let awaitingCommand = false;
let voiceBarTimeout = null;

// ── Audio context (lazy init after user gesture) ──
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ── Chime sound ──
function playChime() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
  osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.4);
}

// ── Alarm sound ──
let alarmOscillators = new Map();
function startAlarmSound(timerId) {
  if (alarmOscillators.has(timerId)) return;
  const ctx = getAudioCtx();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();

  osc1.type = 'square';
  osc1.frequency.value = 800;
  osc2.type = 'sawtooth';
  osc2.frequency.value = 1000;
  lfo.type = 'sine';
  lfo.frequency.value = 4;
  lfoGain.gain.value = 200;
  gain.gain.value = 0.12;

  lfo.connect(lfoGain);
  lfoGain.connect(osc1.frequency);
  lfoGain.connect(osc2.frequency);
  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);

  osc1.start();
  osc2.start();
  lfo.start();

  alarmOscillators.set(timerId, { osc1, osc2, lfo, gain });
}

function stopAlarmSound(timerId) {
  const nodes = alarmOscillators.get(timerId);
  if (!nodes) return;
  try {
    nodes.gain.gain.setValueAtTime(0, getAudioCtx().currentTime);
    nodes.osc1.stop();
    nodes.osc2.stop();
    nodes.lfo.stop();
  } catch(e) {}
  alarmOscillators.delete(timerId);
}

// ── Speech synthesis ──
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  utter.pitch = 1.0;
  utter.volume = 1.0;
  window.speechSynthesis.speak(utter);
}

// ── Logging ──
function logTimer(label, durationSec) {
  try {
    fetch('http://192.168.2.102:9003/api/timer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label, duration_seconds: durationSec, device: 'timer-web' })
    }).catch(() => {});
  } catch(e) {}
}

// ── Timer management ──
function addTimer(label, durationSec) {
  if (timers.length >= 6) {
    speak('Maximum 6 timers reached.');
    return;
  }
  const id = nextId++;
  const timer = {
    id,
    label: label || 'Timer',
    totalSec: durationSec,
    remainSec: durationSec,
    startTime: Date.now(),
    state: 'running', // running | alarm | dismissed
    interval: null
  };

  timer.interval = setInterval(() => tickTimer(timer), 250);
  timers.push(timer);
  logTimer(timer.label, durationSec);
  renderTimers();
}

function tickTimer(timer) {
  if (timer.state !== 'running') return;
  const elapsed = (Date.now() - timer.startTime) / 1000;
  timer.remainSec = Math.max(0, timer.totalSec - elapsed);

  if (timer.remainSec <= 0) {
    timer.state = 'alarm';
    clearInterval(timer.interval);
    startAlarmSound(timer.id);
    speak('Attention. ' + timer.label + ' timer is done.');
  }
  renderTimers();
}

function dismissTimer(id) {
  const idx = timers.findIndex(t => t.id === id);
  if (idx === -1) return;
  const timer = timers[idx];
  clearInterval(timer.interval);
  stopAlarmSound(timer.id);
  timers.splice(idx, 1);
  renderTimers();
}

function dismissAllAlarms() {
  const alarming = timers.filter(t => t.state === 'alarm');
  alarming.forEach(t => dismissTimer(t.id));
  if (alarming.length === 0) {
    // dismiss most recent
    if (timers.length > 0) {
      dismissTimer(timers[timers.length - 1].id);
    }
  }
}

// ── Rendering ──
const timerGrid = document.getElementById('timerGrid');
const emptyState = document.getElementById('emptyState');

function renderTimers() {
  if (timers.length === 0) {
    timerGrid.classList.add('hidden');
    emptyState.classList.remove('hidden');
    return;
  }
  emptyState.classList.add('hidden');
  timerGrid.classList.remove('hidden');

  // Adjust columns based on count
  if (timers.length <= 2) {
    timerGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(300px, 1fr))';
  } else {
    timerGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(260px, 1fr))';
  }

  timerGrid.innerHTML = '';
  timers.forEach(timer => {
    const card = document.createElement('div');
    card.className = 'timer-card' + (timer.state === 'alarm' ? ' alarm' : '');
    card.onclick = () => {
      if (timer.state === 'alarm') dismissTimer(timer.id);
    };

    const fraction = timer.totalSec > 0 ? timer.remainSec / timer.totalSec : 0;
    const circumference = 2 * Math.PI * 68;
    const dashoffset = circumference * (1 - fraction);
    const strokeColor = timer.state === 'alarm' ? 'var(--alarm-gold)' : 'var(--gold)';

    const mins = Math.floor(timer.remainSec / 60);
    const secs = Math.floor(timer.remainSec % 60);
    const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

    let statusText = '';
    if (timer.state === 'alarm') {
      statusText = 'DONE — TAP TO DISMISS';
    } else {
      const totalMin = Math.round(timer.totalSec / 60);
      statusText = totalMin + ' min timer';
    }

    card.innerHTML = `
      <div class="ring-container">
        <svg viewBox="0 0 160 160">
          <circle class="ring-bg" cx="80" cy="80" r="68"/>
          <circle class="ring-progress" cx="80" cy="80" r="68"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${dashoffset}"
            style="stroke: ${strokeColor}"/>
        </svg>
        <div class="ring-time">${timeStr}</div>
      </div>
      <div class="timer-label">${escHtml(timer.label)}</div>
      <div class="timer-status">${statusText}</div>
    `;
    timerGrid.appendChild(card);
  });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Voice bar ──
const voiceBar = document.getElementById('voiceBar');
const voiceText = document.getElementById('voiceText');
function showVoiceBar(text, durationMs) {
  voiceText.textContent = text;
  voiceBar.classList.add('visible');
  clearTimeout(voiceBarTimeout);
  voiceBarTimeout = setTimeout(() => voiceBar.classList.remove('visible'), durationMs || 3000);
}

// ── Command parsing ──
function parseTimerCommand(text) {
  // Normalize
  let t = text.toLowerCase().trim();

  // Check for dismiss/clear
  if (/\b(dismiss|clear|stop|cancel|silence)\b/.test(t)) {
    return { action: 'dismiss' };
  }

  // Try to extract duration and unit
  // Patterns: "salmon 12 minutes", "12 minute salmon", "set salmon for 12 minutes"
  // Also: "30 seconds", "1 and a half minutes", "90 seconds"

  // Remove filler words
  t = t.replace(/\b(set|start|a|an|the|for|of|please|timer|time)\b/g, ' ').trim();
  t = t.replace(/\s+/g, ' ');

  let durationSec = 0;
  let label = '';

  // Match number + unit
  const durationMatch = t.match(/(\d+(?:\.\d+)?)\s*(minutes?|mins?|seconds?|secs?|hours?|hrs?)/i);
  if (durationMatch) {
    let val = parseFloat(durationMatch[1]);
    let unit = durationMatch[2].toLowerCase();
    if (unit.startsWith('h')) durationSec = val * 3600;
    else if (unit.startsWith('s')) durationSec = val;
    else durationSec = val * 60;

    // Label is everything except the matched duration
    label = t.replace(durationMatch[0], '').trim();
  } else {
    // Try just a number (assume minutes)
    const numMatch = t.match(/(\d+(?:\.\d+)?)/);
    if (numMatch) {
      durationSec = parseFloat(numMatch[1]) * 60;
      label = t.replace(numMatch[0], '').trim();
    }
  }

  if (durationSec <= 0) return null;

  // Clean up label
  label = label.replace(/^\s*[-,\.]+\s*/, '').replace(/\s*[-,\.]+\s*$/, '').trim();
  if (!label) label = 'Timer';

  // Title case label
  label = label.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

  return { action: 'set', label, durationSec: Math.round(durationSec) };
}

// ── Speech Recognition ──
const micDot = document.getElementById('micDot');

function startRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showVoiceBar('Speech recognition not supported', 5000);
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  let wakeDetected = false;
  let fullTranscript = '';

  recognition.onstart = () => {
    isListening = true;
    if (!awaitingCommand) {
      micDot.className = 'mic-dot active';
    }
  };

  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += t;
      } else {
        interimTranscript += t;
      }
    }

    const combined = (finalTranscript + interimTranscript).toLowerCase();

    if (awaitingCommand) {
      showVoiceBar(finalTranscript || interimTranscript, 4000);

      if (finalTranscript) {
        // Process the command
        const cmd = parseTimerCommand(finalTranscript);
        if (cmd) {
          if (cmd.action === 'dismiss') {
            dismissAllAlarms();
            showVoiceBar('Dismissed', 2000);
          } else if (cmd.action === 'set') {
            addTimer(cmd.label, cmd.durationSec);
            const durMin = Math.round(cmd.durationSec / 60);
            const durStr = cmd.durationSec >= 60
              ? durMin + ' minute' + (durMin !== 1 ? 's' : '')
              : cmd.durationSec + ' second' + (cmd.durationSec !== 1 ? 's' : '');
            speak('Timer set. ' + cmd.label + ', ' + durStr + '.');
            showVoiceBar('Timer set: ' + cmd.label + ' — ' + durStr, 4000);
          }
        }
        awaitingCommand = false;
        micDot.className = 'mic-dot active';
      }
    } else {
      // Listen for wake word
      if (/\bhey\s*micro\b/i.test(combined) || /\bmicro\b/i.test(combined)) {
        awaitingCommand = true;
        wakeDetected = true;
        micDot.className = 'mic-dot wake';
        playChime();
        showVoiceBar('Listening for command...', 6000);

        // Restart recognition to get a clean slate for the command
        try { recognition.stop(); } catch(e) {}
        return;
      }
    }
  };

  recognition.onerror = (event) => {
    if (event.error === 'no-speech' || event.error === 'aborted') {
      // Normal, just restart
    } else {
      console.warn('Speech error:', event.error);
    }
  };

  recognition.onend = () => {
    isListening = false;
    // Always restart unless page is being unloaded
    setTimeout(() => {
      if (document.visibilityState !== 'hidden') {
        try { startRecognition(); } catch(e) {}
      }
    }, 200);
  };

  try {
    recognition.start();
  } catch(e) {
    // Already started, ignore
    setTimeout(() => {
      try { startRecognition(); } catch(e2) {}
    }, 1000);
  }
}

// ── Activation ──
const activateOverlay = document.getElementById('activateOverlay');
const activateBtn = document.getElementById('activateBtn');

activateBtn.addEventListener('click', () => {
  activateOverlay.classList.add('hidden');
  // Initialize audio context (requires user gesture)
  getAudioCtx();
  // Play a quick silent sound to unlock audio
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.01);
  // Start speech recognition
  startRecognition();
  // Prime speech synthesis
  speak('');
});

// ── Manual add modal ──
const modalOverlay = document.getElementById('modalOverlay');
const addBtn = document.getElementById('addBtn');
const labelInput = document.getElementById('labelInput');
const durationInput = document.getElementById('durationInput');
const numpad = document.getElementById('numpad');
const modalCancel = document.getElementById('modalCancel');
const modalStart = document.getElementById('modalStart');

addBtn.addEventListener('click', () => {
  labelInput.value = '';
  durationInput.value = '';
  modalOverlay.classList.remove('hidden');
  labelInput.focus();
});

numpad.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const val = btn.dataset.val;
  if (val === 'back') {
    durationInput.value = durationInput.value.slice(0, -1);
  } else {
    if (durationInput.value.length < 5) {
      durationInput.value += val;
    }
  }
});

modalCancel.addEventListener('click', () => {
  modalOverlay.classList.add('hidden');
});

modalStart.addEventListener('click', () => {
  const label = labelInput.value.trim() || 'Timer';
  const mins = parseFloat(durationInput.value);
  if (!mins || mins <= 0) {
    durationInput.style.borderColor = 'var(--alarm-red)';
    setTimeout(() => durationInput.style.borderColor = 'var(--blue)', 1000);
    return;
  }
  addTimer(label, Math.round(mins * 60));
  modalOverlay.classList.add('hidden');
  const durStr = mins + ' minute' + (mins !== 1 ? 's' : '');
  speak('Timer set. ' + label + ', ' + durStr + '.');
});

// Close modal on overlay click
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.add('hidden');
});

// ── Visibility change: restart recognition ──
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !isListening && !activateOverlay.classList.contains('hidden')) {
    // recognition should restart via onend handler
  }
});

// ── Initial render ──
renderTimers();
</script>
</body>
